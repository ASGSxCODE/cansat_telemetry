<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CanSat Ground Station</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="brand">
            <p class="callsign">GS-01</p>
            <h1>CanSat Ground Station</h1>
            <p class="subtitle">Offline CSV analysis</p>
        </div>

        <div class="header-right">
            <label class="load-csv">
                <input type="file" id="csvFile" accept=".csv,text/csv">
                Upload CSV
            </label>
            <p id="file-name">No file uploaded</p>
        </div>
    </header>

    <section>
        <h2>Dataset extrema</h2>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Quantity</th>
                        <th>Maximum</th>
                        <th>Minimum</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Pressure</td>
                        <td id="pressure-max">—</td>
                        <td id="pressure-min">—</td>
                    </tr>
                    <tr>
                        <td>Temperature</td>
                        <td id="temperature-max">—</td>
                        <td id="temperature-min">—</td>
                    </tr>
                    <tr>
                        <td>Altitude</td>
                        <td id="altitude-max">—</td>
                        <td>—</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <p id="dataset-meta" class="dataset-meta"></p>
    </section>

    <section>
        <h2>Environment</h2>
        <div class="graph-grid">
            <div class="graph-card">
                <h3>Altitude</h3>
                <div class="chart-wrap">
                    <canvas id="altitudeChart"></canvas>
                </div>
            </div>
            <div class="graph-card">
                <h3>Temperature</h3>
                <div class="chart-wrap">
                    <canvas id="temperatureChart"></canvas>
                </div>
            </div>
            <div class="graph-card">
                <h3>Pressure</h3>
                <div class="chart-wrap">
                    <canvas id="pressureChart"></canvas>
                </div>
            </div>
        </div>
    </section>

    <section>
        <h2>IMU</h2>
        <div class="graph-grid imu-grid">
            <div class="graph-card">
                <h3>Accelerometer X / Y / Z</h3>
                <div class="chart-wrap">
                    <canvas id="accelChart"></canvas>
                </div>
            </div>
            <div class="graph-card">
                <h3>Gyroscope X / Y / Z</h3>
                <div class="chart-wrap">
                    <canvas id="gyroChart"></canvas>
                </div>
            </div>
            <div class="graph-card">
                <h3>Magnetometer X / Y / Z</h3>
                <div class="chart-wrap">
                    <canvas id="magChart"></canvas>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
